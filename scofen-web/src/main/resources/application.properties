# Scofen Modeler Studio — 默认运行配置
# 默认内存态（重启即复位），无需数据库；MySQL 由使用方自备。
# 启用持久化：设置 scofen.persistence.mode=mysql 并配置下方数据源（或环境变量
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD）。
scofen.persistence.mode=memory

# 落库模式下，每个项目保留最近多少个 revision 的整包快照（超出即删除，防止无限膨胀）。
# 留窗口是为了能回退到前一版，不是做历史归档。
scofen.persistence.snapshot-retention=100

# 默认内存态不引入任何 DataSource / JdbcTemplate 自动配置（无数据库依赖）。
# 仅 mysql 模式（见 PersistenceConfig）才手工装配 HikariDataSource + JdbcTemplate。
# 同时排除 Actuator 的 JDBC 健康指示器，避免它在内存态仍尝试推断一个 DataSource。
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration

spring.application.name=scofen-modeler-studio

# 写穿落库时整包 JSON 较大，放宽服务端限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr(%logger{36}){cyan} %clr(%msg){faint}%n

# 安全默认值：错误响应仅含状态码；需要排查时可用 ?trace 查看堆栈（on_param）。
server.error.include-stacktrace=on_param
server.error.include-message=never
